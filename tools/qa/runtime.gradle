
sourceSets { qaMod { java.srcDir 'tools/qa/runtime/java'; resources.srcDir 'tools/qa/runtime/resources'; compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += output + compileClasspath } }
tasks.register('qaJar', Jar) { archiveBaseName='YiShenCombatQA'; archiveClassifier='test'; from sourceSets.qaMod.output }
reobf { qaJar {} }
tasks.named('qaJar').configure { finalizedBy 'reobfQaJar' }

minecraft.runs {
 gameTestServer {
  workingDirectory project.file('../work/humility-gametest')
  property 'forge.enabledGameTestNamespaces', 'starcrownqa'
  args '--mixin', 'starcrowndoll.mixins.json'
  mods {
   starcrowndoll { source sourceSets.main }
   starcrownqa { source sourceSets.qaMod }
  }
 }
}

if (project.hasProperty('sevenVisual')) {
 minecraft.runs.client {
  workingDirectory project.file('../work/seven-client')
  args '--username', 'SevenQA', '--width', '1280', '--height', '900'
  mods { starcrownqa { source sourceSets.qaMod } }
 }
}

if (project.hasProperty('visibilityFix')) {
 minecraft.runs.client {
  workingDirectory project.file('../work/visibility-fix-client')
  args '--username', 'VisibilityQA', '--width', '1000', '--height', '700', '--quickPlaySingleplayer', 'HumilityQA'
  mods { starcrownqa { source sourceSets.qaMod } }
 }
}

if (project.hasProperty('panelRuntime')) {
 minecraft.runs.client {
  workingDirectory project.file('../work/panel-runtime-client')
  args '--username', 'PanelQA', '--width', '1280', '--height', '900', '--quickPlaySingleplayer', 'HumilityQA'
  mods { starcrownqa { source sourceSets.qaMod } }
 }
}

if (project.hasProperty('fishHugVisual')) {
 minecraft.runs.client {
  workingDirectory project.file('../work/fish-hug-client')
  args '--username', 'FishHugQA', '--width', '1100', '--height', '760'
  mods { starcrownqa { source sourceSets.qaMod } }
 }
}
