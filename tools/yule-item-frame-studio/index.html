<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>余乐玩偶 · 粉金物品框工作站</title><link rel="stylesheet" href="style.css">
<header><div><small>YULE / ITEM FRAME STUDIO</small><h1>余乐玩偶 <span>· 粉金物品显示框</span></h1></div><span class="badge">仅预览 · 不修改游戏</span></header>
<main><section class="workspace"><div class="bar"><span>动态鎏金 / 粉白金流动</span><button id="pause">暂停动画</button></div><div class="stage" id="stage"><div class="inventory"><div class="inventory-label">物品栏</div><div class="slots" id="slots"></div></div><div class="artwork" id="artwork"><div class="echo back sprite"></div><div class="layer holding sprite" role="img" aria-label="透明抱鱼人物"></div><div class="layer raised sprite" role="img" aria-label="透明举鱼人物"></div></div>
<article class="tooltip" id="tooltip"><div class="ribbon r1"></div><div class="ribbon r2"></div><div class="pearl p1"></div><div class="pearl p2"></div><div class="tip-head"><div><h2 class="flow">余乐玩偶</h2><div class="divinity flow">摸鱼神性</div><div class="yule-lore flow">美七德兮天地清</div></div></div><div id="details" class="details"></div><div class="hint flow" id="hint">按下 <kbd>Shift</kbd> 显示更多</div></article><div class="stage-note">奶白珠光 · 粉金缎带边框 · 无星空</div></div><footer><span id="mode-status">抱鱼图层</span><span>按下 Shift 固定说明，再按关闭 · 空格预览举鱼</span></footer></section>
<aside><h2>预览与调参</h2><p class="intro">两种抱鱼动作已制作透明人物图层。柔粉、奶白和香槟金呼应皮肤主题，不使用星空或星点装饰。</p><div class="buttons"><button class="selected" data-pose="holding">抱鱼</button><button data-pose="raised">举鱼</button><button data-pose="auto">自动切换</button></div><label class="toggle">展开技能说明<input id="expanded" type="checkbox"></label><div id="controls"></div><label class="toggle">人物淡残影<input id="echo" type="checkbox" checked></label><label class="toggle">粉金白动态文字<input id="flow" type="checkbox" checked></label><label class="toggle">轻微右摆归位<input id="sway" type="checkbox" checked></label><div class="palette"><i style="background:#ffb9d4"></i><i style="background:#e8c88e"></i><i style="background:#fff8f4"></i><span>粉 / 金 / 白</span></div><div class="buttons"><button id="reset">恢复默认</button><button id="export">导出参数</button></div><p class="note">边框：粉白金动态鎏金、缎带结角与珠光圆点。人物独立置于面板后方，支持动作切换、淡入淡出和摆动。</p></aside></main><script src="app.js"></script></html>
