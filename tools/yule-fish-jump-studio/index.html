<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>余乐玩偶 · 抱鱼跳跃工作站</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body><header><div><small>YULE DOLL / POSE STUDIO</small><h1>余乐玩偶 <span>· 抱鱼跳跃</span></h1></div><span class="badge">跳跃动作预览</span></header><main><section class="stage"><div id="viewport"></div><div class="stage-top"><span id="pose-label">参考二 · 高低手横抱</span><span>拖动旋转 · 滚轮缩放</span></div><div class="view-buttons"><button data-view="front" class="active">正面</button><button data-view="left">左侧</button><button data-view="right">右侧</button><button id="rotate">自动转台</button></div><div class="stage-bottom"><i></i><span>保留余乐原有皮肤 · 参考图片只调整抱鱼动作</span></div><div id="loading">正在载入玩偶模型…</div></section><aside><section><h2>跳跃与举手 <small id="jump-status">准备</small></h2><div class="actions"><button id="play" class="primary">暂停</button><button id="peak">跳跃顶点</button><button id="ground">站立</button></div><label class="control jump-control"><div><span>动作进度</span><output id="phase-value">0.00 s</output></div><input id="timeline" type="range" min="0" max="2.8" step="0.01" value="0"></label><label class="control jump-control"><div><span>播放速度</span><output id="speed-value">1.0 ×</output></div><input id="play-speed" type="range" min="0.25" max="2" step="0.05" value="1"></label><label class="control jump-control"><div><span>抬臂幅度</span><output id="raise-value">35°</output></div><input id="raise-angle" type="range" min="0" max="100" step="1" value="35"></label><label class="toggle"><span>镜头跟随玩偶</span><input id="follow" type="checkbox" checked></label><p class="note">35° 抬臂已接入游戏 1.20.11，鱼与原手臂一起举起；后续调参仅影响预览。</p></section><section><h2>参考动作 <small>点击切换</small></h2><div class="presets"><button data-preset="0"><img src="references/pose1.jpg"><b>贴胸环抱</b></button><button data-preset="1" class="active"><img src="references/pose2.jpg"><b>高低手横抱</b></button><button data-preset="2"><img src="references/pose3.jpg"><b>双手托鱼</b></button></div><p class="note">使用余乐原有完整手臂模型，只调整旋转与鱼的位置。</p></section><section><h2>鱼的位置</h2><div id="fish-controls"></div><label class="toggle"><span>鱼头朝右</span><input id="fish-right" type="checkbox" checked></label></section><section><h2>抱鱼姿势</h2><div id="arm-controls"></div><label class="toggle"><span>轻微呼吸</span><input id="breath" type="checkbox" checked></label><label class="toggle"><span>显示手部接触点</span><input id="joints" type="checkbox"></label></section><div class="actions"><button id="reset">恢复当前参考</button><button id="export" class="primary">导出姿势参数</button></div><p class="foot">保留原手臂的形状、比例与贴图，不额外添加手掌或拆分手肘。高低手横抱已用于 1.20.10，后续调参不会实时修改游戏。</p></aside></main><script type="module" src="app.js"></script></body></html>
